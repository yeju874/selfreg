<title>부동산 셀프등기 여정</title>
<style>
  :root {
    --bg: #F1F4F1;
    --surface: #FFFFFF;
    --surface-2: #E9EEEA;
    --ink: #16211C;
    --ink-soft: #4E5C55;
    --ink-faint: #7C8B83;
    --line: #D7DFD8;
    --line-strong: #BEC9C0;
    --accent: #1F5C56;
    --accent-strong: #123B37;
    --accent-tint: #E4EEEC;
    --on-accent: #F3F6F1;
    --warn: #A93A2C;
    --warn-bg: #FBECE9;
    --warn-line: #E8B9AF;
    --owner-seller: #8A6A22;
    --owner-seller-tint: #EFE8CE;
    --owner-office: #56626B;
    --owner-office-tint: #E6EAEA;
    --shadow: 0 1px 2px rgba(18, 32, 28, 0.06), 0 6px 20px -12px rgba(18, 32, 28, 0.25);
    --font-body: 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101513;
      --surface: #171F1B;
      --surface-2: #1D2621;
      --ink: #E7EDE9;
      --ink-soft: #A9B8B0;
      --ink-faint: #728178;
      --line: #2A342E;
      --line-strong: #3A463F;
      --accent: #5CB3A0;
      --accent-strong: #7ACBB8;
      --accent-tint: #1B302B;
      --on-accent: #0C1614;
      --warn: #E48A7C;
      --warn-bg: #33201C;
      --warn-line: #5A342B;
      --owner-seller: #D8C27A;
      --owner-seller-tint: #362F1C;
      --owner-office: #9FB0B8;
      --owner-office-tint: #202A2C;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101513; --surface: #171F1B; --surface-2: #1D2621; --ink: #E7EDE9;
    --ink-soft: #A9B8B0; --ink-faint: #728178; --line: #2A342E; --line-strong: #3A463F;
    --accent: #5CB3A0; --accent-strong: #7ACBB8; --accent-tint: #1B302B; --on-accent: #0C1614;
    --warn: #E48A7C; --warn-bg: #33201C; --warn-line: #5A342B;
    --owner-seller: #D8C27A; --owner-seller-tint: #362F1C;
    --owner-office: #9FB0B8; --owner-office-tint: #202A2C;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #F1F4F1; --surface: #FFFFFF; --surface-2: #E9EEEA; --ink: #16211C;
    --ink-soft: #4E5C55; --ink-faint: #7C8B83; --line: #D7DFD8; --line-strong: #BEC9C0;
    --accent: #1F5C56; --accent-strong: #123B37; --accent-tint: #E4EEEC; --on-accent: #F3F6F1;
    --warn: #A93A2C; --warn-bg: #FBECE9; --warn-line: #E8B9AF;
    --owner-seller: #8A6A22; --owner-seller-tint: #EFE8CE;
    --owner-office: #56626B; --owner-office-tint: #E6EAEA;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); overflow-x: hidden; }
  body {
    font-family: var(--font-body);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 64px;
  }
  a { color: var(--accent-strong); }
  a:focus-visible, button:focus-visible, input:focus-visible, [contenteditable]:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }

  header.top {
    position: sticky; top: 0; z-index: 20;
    background: var(--bg); border-bottom: 1px solid var(--line);
    padding-top: env(safe-area-inset-top);
  }
  .top-inner { max-width: 640px; margin: 0 auto; padding: 18px 16px 14px; }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11.5px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--ink-faint); font-weight: 600; margin: 0 0 4px;
  }
  h1.title { font-size: 22px; font-weight: 800; margin: 0 0 6px; letter-spacing: -0.01em; text-wrap: balance; }
  .ref-link {
    display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600;
    color: var(--ink-soft); text-decoration: none; margin: 0 0 12px;
  }
  .ref-link:hover { color: var(--accent-strong); }

  .progress-row { display: flex; align-items: center; gap: 10px; }
  .progress-track { flex: 1; height: 8px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
  .progress-fill { height: 100%; width: 0%; background: var(--accent); border-radius: 5px; transition: width 0.35s ease; }
  .progress-num {
    font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 700;
    color: var(--ink-soft); white-space: nowrap; min-width: 56px; text-align: right;
  }

  .toolbar { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  button.tbtn {
    font-family: var(--font-body); font-size: 13px; font-weight: 600;
    background: var(--surface); color: var(--ink-soft);
    border: 1px solid var(--line-strong); padding: 7px 12px; border-radius: 9px; cursor: pointer;
  }
  button.tbtn:hover { background: var(--surface-2); }
  button.tbtn.on { border-color: var(--accent); color: var(--accent-strong); background: var(--accent-tint); }

  nav.jump {
    display: flex; gap: 8px; overflow-x: auto; margin-top: 12px; padding-bottom: 2px;
    -ms-overflow-style: none; scrollbar-width: none;
  }
  nav.jump::-webkit-scrollbar { display: none; }
  nav.jump a {
    flex: none; font-size: 12.5px; font-weight: 600; text-decoration: none; color: var(--ink-soft);
    background: var(--surface); border: 1px solid var(--line); padding: 6px 11px; border-radius: 999px; white-space: nowrap;
  }

  main { max-width: 640px; margin: 0 auto; padding: 18px 16px 0; }

  /* ---------- next task card ---------- */
  .next-card {
    position: relative; margin: 0 0 22px; padding: 18px 20px 18px;
    background: var(--surface); border: 1.5px solid var(--accent-strong); border-radius: 14px;
    box-shadow: var(--shadow);
  }
  .next-card .stamp {
    position: absolute; top: -16px; right: 18px; width: 54px; height: 54px; border-radius: 50%;
    border: 2px solid var(--accent); background: var(--surface); color: var(--accent-strong);
    transform: rotate(-9deg); display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 11px; letter-spacing: 0.02em; text-align: center; line-height: 1.15;
  }
  .next-card.all-done .stamp { background: var(--accent-strong); color: var(--on-accent); border-color: var(--accent-strong); }
  .next-card .label { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faint); }
  .next-card .place { font-size: 13px; color: var(--accent-strong); font-weight: 700; margin-top: 2px; }
  .next-card h2 { font-size: 18px; font-weight: 800; margin: 8px 56px 5px 0; text-wrap: balance; }
  .next-card .note { font-size: 13.5px; color: var(--ink-soft); margin: 0 56px 12px 0; }
  .next-card .done-btn {
    font-weight: 700; background: var(--accent-strong); color: var(--on-accent); border: none;
    padding: 9px 16px; font-size: 13.5px; border-radius: 9px; cursor: pointer;
  }
  .next-card.all-done { text-align: center; }
  .next-card.all-done h2 { margin-right: 0; }
  .next-card.all-done .note { margin-right: 0; }

  /* ---------- stage ---------- */
  section.stage { margin-bottom: 22px; scroll-margin-top: 132px; }
  .stage-band {
    display: flex; align-items: center; gap: 12px; background: var(--accent-strong); color: var(--on-accent);
    border-radius: 14px 14px 0 0; padding: 13px 16px;
  }
  .stage-band .id {
    flex: none; font-family: var(--font-mono); font-size: 12px; font-weight: 800;
    background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.35);
    border-radius: 999px; padding: 3px 9px;
  }
  .stage-head-text { flex: 1; min-width: 0; }
  .stage-band[data-editing] .stage-title { outline: 1px dashed rgba(255,255,255,0.5); padding: 1px 3px; margin: -1px -3px; border-radius: 4px; }
  .stage-title { font-size: 16.5px; font-weight: 800; letter-spacing: -0.01em; margin: 0; }
  .stage-sub { font-size: 12.5px; opacity: 0.82; margin: 2px 0 0; }
  .stage-count {
    flex: none; font-family: var(--font-mono); font-size: 12px; font-weight: 700;
    background: rgba(255,255,255,0.14); border-radius: 999px; padding: 4px 9px; white-space: nowrap;
  }
  .stage-body { background: var(--surface); border: 1px solid var(--line); border-top: none; border-radius: 0 0 14px 14px; padding: 6px 16px 16px; box-shadow: var(--shadow); }

  /* ---------- task rows ---------- */
  .task {
    display: grid; grid-template-columns: 22px 1fr; gap: 10px; padding: 10px 2px; border-top: 1px solid var(--line);
  }
  .task:first-of-type { border-top: none; }
  .task input[type="checkbox"] {
    appearance: none; -webkit-appearance: none; width: 20px; height: 20px; margin-top: 1px;
    border-radius: 6px; border: 1.5px solid var(--line-strong); background: var(--surface);
    display: grid; place-content: center; cursor: pointer;
  }
  .task input[type="checkbox"]::after {
    content: ""; width: 11px; height: 8px; border-left: 2.5px solid var(--on-accent); border-bottom: 2.5px solid var(--on-accent);
    transform: rotate(-45deg) scale(0); transition: transform 0.12s ease;
  }
  .task input[type="checkbox"]:checked { background: var(--accent-strong); border-color: var(--accent-strong); }
  .task input[type="checkbox"]:checked::after { transform: rotate(-45deg) scale(1); }

  .title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .task .title { font-size: 14.5px; color: var(--ink); }
  .task.done .title { color: var(--ink-faint); text-decoration: line-through; text-decoration-color: var(--line); }
  .task .note { font-size: 12.5px; color: var(--ink-faint); margin-top: 3px; }

  .chip {
    font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; letter-spacing: 0.02em;
    padding: 2px 7px; border-radius: 999px; white-space: nowrap;
  }
  .chip.buyer { color: var(--accent-strong); background: var(--accent-tint); }
  .chip.seller { color: var(--owner-seller); background: var(--owner-seller-tint); }
  .chip.office { color: var(--owner-office); background: var(--owner-office-tint); }

  /* ---------- edit mode ---------- */
  .editctl { display: none; gap: 4px; margin-left: auto; }
  body.edit .editctl { display: flex; }
  .editctl button {
    border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-faint);
    font-size: 11px; width: 22px; height: 22px; cursor: pointer; border-radius: 6px; line-height: 1;
  }
  .editctl button:hover { color: var(--warn); border-color: var(--warn); }
  body.edit .task .title, body.edit .task .note {
    outline: 1px dashed var(--line-strong); padding: 2px 4px; margin: -2px -4px; border-radius: 4px;
  }
  body.edit .task .title:focus, body.edit .task .note:focus { outline: 1.5px dashed var(--accent); }
  select.ownersel {
    display: none; font-family: var(--font-mono); font-size: 10.5px;
    background: var(--surface); color: var(--ink); border: 1px solid var(--line-strong); border-radius: 6px;
  }
  body.edit select.ownersel { display: inline-block; }
  body.edit .chip { display: none; }

  .add-row { display: none; margin: 10px 0 4px; }
  body.edit .add-row { display: block; }
  .add-row button {
    font-size: 12.5px; font-weight: 600; background: none; border: 1px dashed var(--line-strong);
    color: var(--ink-faint); padding: 8px 10px; cursor: pointer; width: 100%; border-radius: 9px;
  }
  .add-row button:hover { color: var(--accent-strong); border-color: var(--accent); }

  body.edit .next-card { display: none; }

  /* ---------- static reference blocks (warn / forms / links) ---------- */
  .warn-box {
    display: flex; gap: 10px; background: var(--warn-bg); border: 1px solid var(--warn-line);
    border-radius: 10px; padding: 11px 12px; margin: 14px 0 4px;
  }
  .warn-label {
    flex: none; font-family: var(--font-mono); font-size: 10.5px; font-weight: 800; letter-spacing: 0.04em;
    color: var(--warn); border: 1px solid var(--warn); border-radius: 5px; padding: 2px 6px; height: fit-content;
  }
  .warn-box p { margin: 0; font-size: 13.5px; color: var(--ink); }
  .warn-box strong { color: var(--warn); }

  .subhead {
    font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-faint); margin: 16px 0 8px;
  }

  .form-card {
    display: flex; align-items: center; gap: 12px; background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 10px; padding: 11px 12px; margin-top: 8px; text-decoration: none; color: var(--ink);
  }
  .form-icon { flex: none; width: 34px; height: 40px; border-radius: 4px; background: var(--surface); border: 1px solid var(--line); position: relative; }
  .form-icon::before {
    content: ""; position: absolute; top: 8px; left: 6px; right: 6px; height: 2px; background: var(--ink-faint);
    box-shadow: 0 5px 0 var(--ink-faint), 0 10px 0 var(--ink-faint);
  }
  .form-meta { flex: 1; min-width: 0; }
  .form-name { font-size: 13.5px; font-weight: 700; margin: 0; }
  .form-sub { font-size: 12px; color: var(--ink-faint); margin: 1px 0 0; }
  .form-tag { flex: none; font-family: var(--font-mono); font-size: 10.5px; font-weight: 800; color: var(--ink-soft); border: 1px solid var(--line); border-radius: 5px; padding: 3px 6px; }

  .link-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .link-btn {
    font-size: 12.5px; font-weight: 700; text-decoration: none; color: var(--accent-strong);
    background: var(--accent-tint); border: 1px solid var(--line); padding: 8px 12px; border-radius: 9px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .link-btn::after { content: "→"; font-weight: 400; }

  footer.foot { max-width: 640px; margin: 8px auto 0; padding: 18px 16px 0; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
  footer.foot .danger {
    font-family: var(--font-mono); font-size: 12px; font-weight: 700; color: var(--ink-soft);
    background: var(--surface); border: 1px solid var(--line-strong); padding: 9px 14px; border-radius: 9px; cursor: pointer;
  }
  footer.foot .danger.confirming { border-color: var(--warn); color: var(--warn); }
  .disclaimer { font-size: 11.5px; color: var(--ink-faint); line-height: 1.6; margin: 0; }

  @media print {
    header.top, .toolbar, nav.jump, .editctl, .add-row, .next-card { display: none !important; }
    body { background: #fff; color: #000; padding-bottom: 0; }
    .task.done .title { color: #555; }
    footer.foot { display: none !important; }
  }
</style>

<header class="top">
  <div class="top-inner">
    <p class="eyebrow">Self Registration Itinerary</p>
    <h1 class="title">부동산 셀프등기 여정</h1>
    <a class="ref-link" href="https://blog.naver.com/som_bee/224325927273" target="_blank" rel="noopener">참고 블로그: 셀프등기 후기 →</a>
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-num" id="progressNum">0/0</div>
    </div>
    <div class="toolbar">
      <button class="tbtn" id="editToggle" type="button">✎ 편집 모드</button>
      <button class="tbtn" id="printBtn" type="button">인쇄용 보기</button>
    </div>
    <nav class="jump" id="jumpNav" aria-label="구간 이동"></nav>
  </div>
</header>

<main>
  <div id="nextCard"></div>
  <div id="stages"></div>
</main>

<footer class="foot">
  <button class="danger" id="resetBtn" type="button">기본 템플릿으로 초기화</button>
  <p class="disclaimer">체크 상태와 수정 내용은 이 브라우저에만 저장됩니다(서버 전송 없음). 세부 절차·구비서류는 관할 행정복지센터·등기소 안내에 따라 달라질 수 있으니 방문 전 유선으로 재확인하세요.</p>
</footer>

          { id: uid(), title: "가족관계증명서 지참", owner: "buyer", note: "", done: false },
          { id: uid(), title: "취득세 신고서 작성", owner: "buyer", note: "", done: false },
          { id: uid(), title: "취득세 고지서 발급", owner: "office", note: "은행 납부용 · 반드시 챙기기", done: false },
          { id: uid(), title: "(필요시) 토지대장·건축물대장 발급", owner: "office", note: "", done: false }
        ],
        extra: ""
      },
      {
        id: "s2", label: "은행", place: "등기소 내 위치한 은행", time: "행정복지센터 다음",
        tasks: [
          { id: uid(), title: "국민주택채권 매입액·발행번호 조회", owner: "buyer", note: "nhuf.molit.go.kr", done: false },
          { id: uid(), title: "국민주택채권 매입", owner: "buyer", note: "매입확인증 2부 수령", done: false },
          { id: uid(), title: "전자수입인지 구매", owner: "buyer", note: "1부", done: false },
          { id: uid(), title: "취득세 납부", owner: "buyer", note: "행정복지센터 고지서 지참 · 영수필확인서 수령", done: false }
        ],
        extra: '<div class="link-row"><a class="link-btn" href="https://nhuf.molit.go.kr/" target="_blank" rel="noopener">국민주택채권 조회 (nhuf)</a></div>'
      },
      {
        id: "s3", label: "등기소", place: "매수 부동산 소재지 관할 등기소", time: "은행 다음",
        tasks: [
          { id: uid(), title: "무인발급기에서 등기신청수수료 결제", owner: "buyer", note: "", done: false },
          { id: uid(), title: "영수증 수령", owner: "buyer", note: "등기신청수수료 영수필확인서", done: false },
          { id: uid(), title: "등기신청서 작성", owner: "buyer", note: "사전 작성분 지참 시 확인만", done: false },
          { id: uid(), title: "서류 제출 및 접수", owner: "buyer", note: "", done: false }
        ],
        extra:
          '<div class="warn-box"><span class="warn-label">확인</span><p>등기소는 <strong>매수한 부동산 소재지 관할 등기소</strong>로 가야 함. 아래 링크에서 관할 확인.</p></div>' +
          '<div class="link-row"><a class="link-btn" href="https://data.iros.go.kr/rp/ro/openRgsOfficeInfrm.do" target="_blank" rel="noopener">관할 등기소 찾기</a></div>'
      },
      {
        id: "s4", label: "등기소 제출 최종 체크리스트", place: "접수 창구 앞", time: "마지막으로 한번 더",
        tasks: [
          { id: uid(), title: "소유권이전등기신청서", owner: "buyer", note: "", done: false },
          { id: uid(), title: "취득세 납부영수증", owner: "buyer", note: "", done: false },
          { id: uid(), title: "국민주택채권 매입영수증", owner: "buyer", note: "", done: false },
          { id: uid(), title: "등기권리증", owner: "seller", note: "", done: false },
          { id: uid(), title: "매매계약서", owner: "buyer", note: "", done: false },
          { id: uid(), title: "등기수수료 영수증", owner: "buyer", note: "", done: false },
          { id: uid(), title: "매도인 인감증명서", owner: "seller", note: "", done: false },
          { id: uid(), title: "매도인 주민등록초본", owner: "seller", note: "", done: false },
          { id: uid(), title: "매수인 주민등록등본", owner: "buyer", note: "", done: false },
          { id: uid(), title: "매수인 주민등록초본", owner: "buyer", note: "", done: false }
        ],
        extra: ""
      }
    ];
  }

  var ownerMeta = {
    buyer: { cls: "buyer", label: "매수인" },
    seller: { cls: "seller", label: "매도인" },
    office: { cls: "office", label: "발급기관" }
  };

  var state = load();

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { stages: defaultStages(), editMode: false };
  }
  function save() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {} }

  function allTasks() {
    var out = [];
    state.stages.forEach(function (st) { st.tasks.forEach(function (t) { out.push({ stage: st, task: t }); }); });
    return out;
  }
  function findNext() {
    var flat = allTasks();
    for (var i = 0; i < flat.length; i++) if (!flat[i].task.done) return flat[i];
    return null;
  }
  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    return e;
  }

  function render() {
    document.body.classList.toggle("edit", !!state.editMode);
    var editBtn = document.getElementById("editToggle");
    editBtn.classList.toggle("on", !!state.editMode);
    editBtn.textContent = state.editMode ? "✓ 편집 완료" : "✎ 편집 모드";

    var flat = allTasks();
    var done = flat.filter(function (x) { return x.task.done; }).length;
    document.getElementById("progressFill").style.width = (flat.length ? (done / flat.length * 100) : 0) + "%";
    document.getElementById("progressNum").textContent = done + "/" + flat.length;

    renderJumpNav();
    renderNextCard();
    renderStages();
  }

  function renderJumpNav() {
    var nav = document.getElementById("jumpNav");
    nav.innerHTML = "";
    state.stages.forEach(function (st) {
      var a = el("a", null, escapeHtml(st.label));
      a.href = "#stage-" + st.id;
      nav.appendChild(a);
    });
  }

  function renderNextCard() {
    var host = document.getElementById("nextCard");
    host.innerHTML = "";
    if (state.editMode) return;
    var card = el("div", "next-card");
    var next = findNext();
    if (!next) {
      card.classList.add("all-done");
      card.innerHTML =
        '<div class="stamp">완료</div>' +
        '<div class="label">진행 상황</div>' +
        '<h2 style="margin-top:10px;">모든 항목을 마쳤습니다</h2>' +
        '<div class="note" style="margin-right:0;">접수증을 잘 보관하고 처리 완료 통지를 기다리세요.</div>';
      host.appendChild(card);
      return;
    }
    card.innerHTML =
      '<div class="stamp">지금<br/>할 일</div>' +
      '<div class="label">' + escapeHtml(next.stage.label) + '</div>' +
      '<div class="place">' + escapeHtml(next.stage.place) + (next.stage.time ? " · " + escapeHtml(next.stage.time) : "") + '</div>' +
      '<h2>' + escapeHtml(next.task.title) + '</h2>' +
      (next.task.note ? '<div class="note">' + escapeHtml(next.task.note) + '</div>' : '') +
      '<button class="done-btn" type="button">완료 체크</button>';
    host.appendChild(card);
    card.querySelector(".done-btn").addEventListener("click", function () {
      next.task.done = true; save(); render();
    });
  }

  function renderStages() {
    var host = document.getElementById("stages");
    host.innerHTML = "";
    state.stages.forEach(function (st, si) {
      var section = el("section", "stage");
      section.id = "stage-" + st.id;

      var band = el("div", "stage-band");
      if (state.editMode) band.setAttribute("data-editing", "1");
      var idBadge = el("div", "id", "0" + (si + 1));
      var headText = el("div", "stage-head-text");
      var titleEl = el("p", "stage-title", escapeHtml(st.label));
      var subEl = el("p", "stage-sub", escapeHtml(st.place) + (st.time ? " · " + escapeHtml(st.time) : ""));
      if (state.editMode) {
        titleEl.contentEditable = "true";
        titleEl.spellcheck = false;
        titleEl.addEventListener("blur", function () { st.label = titleEl.textContent.trim() || st.label; save(); renderJumpNav(); });
      }
      headText.appendChild(titleEl); headText.appendChild(subEl);
      var doneCount = st.tasks.filter(function (t) { return t.done; }).length;
      var countEl = el("div", "stage-count", doneCount + "/" + st.tasks.length);
      band.appendChild(idBadge); band.appendChild(headText); band.appendChild(countEl);
      section.appendChild(band);

      var body = el("div", "stage-body");
      st.tasks.forEach(function (t, ti) { body.appendChild(renderTask(st, t, ti)); });

      if (st.extra) body.appendChild(el("div", null, st.extra));

      var addRow = el("div", "add-row");
      var addBtn = el("button", null, "+ " + escapeHtml(st.label) + "에 항목 추가");
      addBtn.type = "button";
      addBtn.addEventListener("click", function () {
        st.tasks.push({ id: uid(), title: "새 항목", owner: "buyer", note: "", done: false });
        save(); render();
      });
      addRow.appendChild(addBtn);
      body.appendChild(addRow);

      section.appendChild(body);
      host.appendChild(section);
    });
  }

  function renderTask(stage, t, idx) {
    var row = el("div", "task" + (t.done ? " done" : ""));

    var cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = !!t.done;
    cb.addEventListener("change", function () { t.done = cb.checked; save(); render(); });
    row.appendChild(cb);

    var body = el("div");
    var titleRow = el("div", "title-row");

    var title = el("span", "title", escapeHtml(t.title));
    if (state.editMode) {
      title.contentEditable = "true"; title.spellcheck = false;
      title.addEventListener("blur", function () { t.title = title.textContent.trim() || "제목 없음"; save(); });
    }
    titleRow.appendChild(title);

    var chip = el("span", "chip " + ownerMeta[t.owner].cls, ownerMeta[t.owner].label);
    titleRow.appendChild(chip);

    var sel = document.createElement("select");
    sel.className = "ownersel";
    ["buyer", "seller", "office"].forEach(function (k) {
      var opt = document.createElement("option");
      opt.value = k; opt.textContent = ownerMeta[k].label;
      if (k === t.owner) opt.selected = true;
      sel.appendChild(opt);
    });
    sel.addEventListener("change", function () { t.owner = sel.value; save(); render(); });
    titleRow.appendChild(sel);

    var ctl = el("span", "editctl");
    var up = el("button", null, "↑"); up.type = "button"; up.title = "위로";
    up.addEventListener("click", function () {
      if (idx > 0) { var arr = stage.tasks; var tmp = arr[idx - 1]; arr[idx - 1] = arr[idx]; arr[idx] = tmp; save(); render(); }
    });
    var down = el("button", null, "↓"); down.type = "button"; down.title = "아래로";
    down.addEventListener("click", function () {
      var arr = stage.tasks;
      if (idx < arr.length - 1) { var tmp = arr[idx + 1]; arr[idx + 1] = arr[idx]; arr[idx] = tmp; save(); render(); }
    });
    var del = el("button", null, "×"); del.type = "button"; del.title = "삭제";
    del.addEventListener("click", function () { stage.tasks.splice(idx, 1); save(); render(); });
    ctl.appendChild(up); ctl.appendChild(down); ctl.appendChild(del);
    titleRow.appendChild(ctl);

    body.appendChild(titleRow);

    var note = el("div", "note", escapeHtml(t.note));
    if (state.editMode) {
      note.contentEditable = "true"; note.spellcheck = false;
      note.addEventListener("blur", function () { t.note = note.textContent.trim(); save(); });
    }
    if (t.note || state.editMode) body.appendChild(note);

    row.appendChild(body);
    return row;
  }

  document.getElementById("editToggle").addEventListener("click", function () {
    state.editMode = !state.editMode; save(); render();
  });
  document.getElementById("printBtn").addEventListener("click", function () { window.print(); });

  var resetBtn = document.getElementById("resetBtn");
  var confirming = false;
  resetBtn.addEventListener("click", function () {
    if (!confirming) {
      confirming = true;
      resetBtn.textContent = "정말 초기화할까요? 다시 클릭";
      resetBtn.classList.add("confirming");
      setTimeout(function () {
        confirming = false;
        resetBtn.textContent = "기본 템플릿으로 초기화";
        resetBtn.classList.remove("confirming");
      }, 3000);
      return;
    }
    state = { stages: defaultStages(), editMode: false };
    save(); render();
    confirming = false;
    resetBtn.textContent = "기본 템플릿으로 초기화";
    resetBtn.classList.remove("confirming");
  });

  render();
})();
</script>
